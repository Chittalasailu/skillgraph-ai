services:
  - type: web
    name: skillgraph-ai-backend
    runtime: node
    region: oregon
    branch: main
    rootDir: backend
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard; sync: false keeps them out of the repo.
      # CORS_ORIGIN should be the frontend origin, e.g. https://skillgraph-ai-sailu1.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  - type: static
    name: skillgraph-ai-frontend
    branch: main
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
